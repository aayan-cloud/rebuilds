<meta charset="utf-8">
<title>Slow Light</title>
<link rel="icon" href="data:,">
<meta name="description" content="Walk down a street where light crawls at 5 km/h. Real aberration, Doppler shift and time dilation.">
<style>
  :root {
    --bg: #04050a; --fg: #e9ecf3; --dim: #838aa0; --line: #1a1e2b; --accent: #6ea8ff;
    font-family: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

  .hud { position: fixed; font-size: 12px; pointer-events: none; }
  .hud input, .hud button { pointer-events: auto; }
  .title { top: 20px; left: 22px; max-width: 36ch; }
  .title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .title p { margin: 6px 0 0; color: var(--dim); line-height: 1.55; }

  .readouts { top: 20px; right: 22px; display: grid; gap: 5px; text-align: right; color: var(--dim); }
  .readouts b { color: var(--fg); margin-left: 10px; font-family: "Geist Mono", ui-monospace, monospace; font-weight: 500; }

  .controls {
    left: 22px; bottom: 22px; display: grid; gap: 12px; min-width: 300px;
    background: color-mix(in srgb, var(--bg) 70%, transparent);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; backdrop-filter: blur(8px);
  }
  .ctl { display: grid; gap: 6px; }
  .ctl .top { display: flex; justify-content: space-between; color: var(--dim); }
  .ctl output { color: var(--fg); font-family: "Geist Mono", ui-monospace, monospace; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .toggles { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 11px; color: var(--fg); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px;
  }
  button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  .hint { right: 22px; bottom: 22px; color: var(--dim); text-align: right; line-height: 1.6; }
  @media (max-width: 760px) {
    .title p, .hint { display: none; }
    .controls { left: 12px; right: 12px; bottom: 12px; min-width: 0; }
  }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">

<canvas id="gl"></canvas>

<div class="hud title">
  <h1>Slow Light</h1>
  <p>Light here moves at 5 km/h. Cycle past a parked car and the street bends towards you, turns blue ahead and red behind, and your watch falls behind the street clock.</p>
</div>

<div class="hud readouts">
  <div>speed <b id="rSpeed">--</b></div>
  <div>&beta; = v/c <b id="rBeta">--</b></div>
  <div>&gamma; <b id="rGamma">--</b></div>
  <div>your clock <b id="rProper">--</b></div>
  <div>street clock <b id="rCoord">--</b></div>
  <div>fps <b id="rFps">--</b></div>
</div>

<div class="hud controls">
  <div class="ctl">
    <div class="top"><span>your speed</span><output id="vOut">4.0 km/h</output></div>
    <input id="v" type="range" min="0" max="499" step="1" value="400">
  </div>
  <div class="toggles">
    <button id="bAberration" aria-pressed="true">aberration</button>
    <button id="bDoppler" aria-pressed="true">doppler</button>
    <button id="bBeam" aria-pressed="true">headlight</button>
    <button id="bRun" aria-pressed="true">moving</button>
  </div>
</div>

<div class="hud hint">drag to look &middot; scroll to change speed</div>

<script type="x-shader/x-fragment" id="frag">#version 300 es
precision highp float;

uniform vec2  uRes;
uniform vec3  uCam;
uniform mat3  uBasis;
uniform float uBeta;      // v/c
uniform float uTime;
uniform int   uSteps;
uniform float uAberration, uDoppler, uBeam;
out vec4 outColor;

const float FAR = 90.0;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float sdBox(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

// A street: ground, kerbs, lamp posts and buildings repeated along z.
// id is returned so the fragment stage can colour each material.
vec2 map(vec3 p) {
  float d = p.y;                                   // ground
  float id = 1.0;

  vec3 q = p;
  q.z = mod(p.z + 6.0, 12.0) - 6.0;                // repeat every 12 m

  // lamp posts, both pavements
  vec3 lp = q; lp.x = abs(lp.x) - 5.2;
  float post = sdBox(lp - vec3(0.0, 2.2, 0.0), vec3(0.09, 2.2, 0.09));
  float arm  = sdBox(lp - vec3(-0.45 * sign(lp.x + 0.0001), 4.3, 0.0), vec3(0.5, 0.07, 0.07));
  float lamp = min(post, arm);
  if (lamp < d) { d = lamp; id = 2.0; }

  // buildings
  vec3 b = q; b.x = abs(b.x) - 10.5;
  float h = 6.0 + floor(hash21(vec2(floor((p.z + 6.0) / 12.0), sign(p.x))) * 4.0) * 1.6;
  float bld = sdBox(b - vec3(0.0, h * 0.5, 0.0), vec3(3.2, h * 0.5, 4.6));
  if (bld < d) { d = bld; id = 3.0; }

  // kerbs
  vec3 k = p; k.x = abs(k.x) - 5.0;
  float kerb = sdBox(k - vec3(0.0, 0.08, 0.0), vec3(0.25, 0.08, 400.0));
  if (kerb < d) { d = kerb; id = 4.0; }

  return vec2(d, id);
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(
    map(p + e.xyy).x - map(p - e.xyy).x,
    map(p + e.yxy).x - map(p - e.yxy).x,
    map(p + e.yyx).x - map(p - e.yyx).x));
}

vec3 material(vec3 p, float id, vec3 n) {
  if (id == 1.0) {                                  // road with centre line
    float line = smoothstep(0.16, 0.12, abs(p.x)) * step(0.5, fract(p.z * 0.14));
    float tar = 0.045 + 0.02 * hash21(floor(p.xz * 2.0));
    return mix(vec3(tar), vec3(0.62, 0.58, 0.22), line);
  }
  if (id == 2.0) return vec3(0.55, 0.57, 0.62);     // lamp post
  if (id == 4.0) return vec3(0.42, 0.43, 0.47);     // kerb
  // buildings: windows lit at random
  float col = floor(p.y / 1.4);
  float row = floor((abs(p.x) > 6.0 ? p.z : p.x) / 1.6);
  float lit = step(0.62, hash21(vec2(col, row)));
  vec3 wall = vec3(0.16, 0.16, 0.19) + 0.03 * hash21(vec2(row, col + 4.0));
  vec3 win = mix(vec3(0.08), vec3(1.0, 0.86, 0.6), lit);
  float grid = step(0.12, fract(p.y / 1.4)) * step(0.12, fract((abs(p.x) > 6.0 ? p.z : p.x) / 1.6));
  return mix(wall, win, grid * 0.9);
}

// Approximate wavelength shift as an RGB rotation: >1 shifts towards blue.
vec3 dopplerShift(vec3 c, float D) {
  float s = clamp(log(D) * 0.85, -1.2, 1.2);
  vec3 warm = vec3(1.25, 0.72, 0.38);
  vec3 cool = vec3(0.48, 0.78, 1.35);
  vec3 tint = s > 0.0 ? mix(vec3(1.0), cool, s) : mix(vec3(1.0), warm, -s);
  return c * tint;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 dir = normalize(uBasis * vec3(uv, -1.25));

  // Relativistic aberration. The observer moves along +z, so the angle to that
  // axis transforms as cos t' = (cos t + b) / (1 + b cos t). Light from ahead
  // crowds into a smaller cone, which is the bending you see.
  float beta = uBeta * uAberration;
  float ct = dir.z;
  float ct2 = (ct + beta) / (1.0 + beta * ct);
  float st2 = sqrt(max(0.0, 1.0 - ct2 * ct2));
  vec2 perp = length(dir.xy) > 1e-6 ? normalize(dir.xy) : vec2(0.0);
  vec3 rayDir = normalize(vec3(perp * st2, ct2));

  // Doppler factor for the direction we are actually receiving from.
  float gamma = 1.0 / sqrt(max(1.0 - uBeta * uBeta, 1e-6));
  float D = 1.0 / (gamma * (1.0 - uBeta * ct2));

  float t = 0.0;
  float id = 0.0;
  vec3 p = uCam;
  bool hit = false;
  for (int i = 0; i < 400; i++) {
    if (i >= uSteps) break;
    p = uCam + rayDir * t;
    vec2 m = map(p);
    if (m.x < 0.0015 * t + 0.0012) { id = m.y; hit = true; break; }
    t += m.x * 0.92;
    if (t > FAR) break;
  }

  vec3 col;
  if (hit) {
    vec3 n = normalAt(p);
    vec3 base = material(p, id, n);
    vec3 sun = normalize(vec3(0.35, 0.72, -0.5));
    float diff = max(dot(n, sun), 0.0) * 0.75 + 0.25;
    float fog = 1.0 - exp(-t * 0.018);
    col = base * diff;
    col = mix(col, vec3(0.03, 0.04, 0.07), fog);
  } else {
    // sky gradient plus a low sun
    float h = clamp(rayDir.y * 0.5 + 0.5, 0.0, 1.0);
    col = mix(vec3(0.05, 0.07, 0.12), vec3(0.01, 0.015, 0.03), h);
    col += vec3(0.5, 0.35, 0.18) * pow(max(dot(rayDir, normalize(vec3(0.35, 0.1, -0.9))), 0.0), 64.0);
  }

  if (uDoppler > 0.5) col = dopplerShift(col, D);
  // Headlight effect: intensity scales as D^3 for a moving observer.
  if (uBeam > 0.5) col *= clamp(pow(D, 3.0), 0.05, 6.0);

  col = col / (col + 0.85);                        // tonemap
  col = pow(col, vec3(0.4545));
  outColor = vec4(col, 1.0);
}
</script>

<script>
(() => {
  'use strict';
  const params = new URLSearchParams(location.search);
  const PEAK = params.get('peak') === '1';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl2', { antialias: false, powerPreference: 'high-performance' });
  if (!gl) { document.body.innerHTML = '<p style="padding:32px;font:14px system-ui">This needs WebGL2.</p>'; return; }

  const VERT = `#version 300 es
  void main() {
    vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;
  const sh = (t, src) => {
    const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent.trim()));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const U = {};
  for (const n of ['uRes', 'uCam', 'uBasis', 'uBeta', 'uTime', 'uSteps', 'uAberration', 'uDoppler', 'uBeam']) {
    U[n] = gl.getUniformLocation(prog, n);
  }

  // The whole conceit: c is 5 km/h, so a bicycle is relativistic.
  const C_KMH = 5;
  const state = {
    speedKmh: 4.0, yaw: 0, pitch: -0.03, z: 0,
    aberration: 1, doppler: 1, beam: 1, running: true,
    properTime: 0, coordTime: 0,
    steps: PEAK ? 320 : (matchMedia('(max-width:760px)').matches ? 90 : 160),
    scale: PEAK ? 1 : (matchMedia('(max-width:760px)').matches ? 0.6 : 0.85),
    auto: !PEAK,
  };
  if (PEAK) state.speedKmh = 4.97;

  const el = id => document.getElementById(id);
  const vIn = el('v');
  vIn.value = Math.round(state.speedKmh * 100);
  const setSpeed = kmh => {
    state.speedKmh = Math.min(C_KMH * 0.999, Math.max(0, kmh));
    vIn.value = Math.round(state.speedKmh * 100);
    el('vOut').textContent = state.speedKmh.toFixed(2) + ' km/h';
  };
  setSpeed(state.speedKmh);
  vIn.oninput = () => setSpeed(+vIn.value / 100);

  const toggle = (id, key) => {
    const b = el(id);
    b.onclick = () => { state[key] = state[key] ? 0 : 1; b.setAttribute('aria-pressed', String(!!state[key])); };
  };
  toggle('bAberration', 'aberration');
  toggle('bDoppler', 'doppler');
  toggle('bBeam', 'beam');
  el('bRun').onclick = () => {
    state.running = !state.running;
    el('bRun').setAttribute('aria-pressed', String(state.running));
  };

  let drag = false, lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    state.yaw -= (e.clientX - lx) * 0.004;
    state.pitch = Math.max(-0.6, Math.min(0.6, state.pitch - (e.clientY - ly) * 0.003));
    lx = e.clientX; ly = e.clientY;
  });
  const end = () => { drag = false; };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', e => { e.preventDefault(); setSpeed(state.speedKmh - Math.sign(e.deltaY) * 0.08); }, { passive: false });

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, PEAK ? 2 : 1.75);
    const w = Math.max(1, Math.round(innerWidth * dpr * state.scale));
    const h = Math.max(1, Math.round(innerHeight * dpr * state.scale));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  }

  const bench = {
    frames: 0, fps: 0, slow: 0, worst: 0, samples: [],
    get memoryMB() { return performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null; },
    report() {
      const s = this.samples.slice().sort((a, b) => a - b);
      const pct = p => s.length ? +s[Math.min(s.length - 1, Math.floor(s.length * p))].toFixed(2) : null;
      const beta = state.speedKmh / C_KMH;
      return {
        frames: this.frames, fps: +this.fps.toFixed(1), medianFrameMs: pct(0.5),
        p95FrameMs: pct(0.95), worstFrameMs: +this.worst.toFixed(2), slowFrames: this.slow,
        steps: state.steps, resolution: canvas.width + 'x' + canvas.height,
        beta: +beta.toFixed(3), gamma: +(1 / Math.sqrt(1 - beta * beta)).toFixed(2),
        memoryMB: this.memoryMB,
      };
    },
    reset() { this.frames = 0; this.slow = 0; this.worst = 0; this.samples = []; },
  };
  window.__bench = bench;

  let last = performance.now(), acc = 0, count = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    const ms = dt * 1000;

    bench.frames++;
    bench.samples.push(ms);
    if (bench.samples.length > 2000) bench.samples.shift();
    if (ms > 1000 / 45) bench.slow++;
    if (ms > bench.worst && bench.frames > 5) bench.worst = ms;

    const beta = state.speedKmh / C_KMH;
    const gamma = 1 / Math.sqrt(Math.max(1 - beta * beta, 1e-9));

    if (state.running && !reduced) {
      // Move at the chosen speed; 1 unit = 1 metre, 5 km/h = 1.389 m/s.
      state.z += dt * (state.speedKmh / 3.6);
      state.coordTime += dt;
      state.properTime += dt / gamma;           // your watch runs slow
    }

    resize();
    const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
    const fwd = [cp * sy, sp, cp * cy];
    const right = [cy, 0, -sy];
    const up = [
      right[1] * fwd[2] - right[2] * fwd[1],
      right[2] * fwd[0] - right[0] * fwd[2],
      right[0] * fwd[1] - right[1] * fwd[0],
    ];
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform3f(U.uCam, 0, 1.65, state.z);
    gl.uniformMatrix3fv(U.uBasis, false, [right[0], right[1], right[2], up[0], up[1], up[2], -fwd[0], -fwd[1], -fwd[2]]);
    gl.uniform1f(U.uBeta, beta);
    gl.uniform1f(U.uTime, state.coordTime);
    gl.uniform1i(U.uSteps, state.steps | 0);
    gl.uniform1f(U.uAberration, state.aberration);
    gl.uniform1f(U.uDoppler, state.doppler);
    gl.uniform1f(U.uBeam, state.beam);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    acc += ms; count++;
    if (acc > 450) {
      bench.fps = 1000 / (acc / count);
      el('rFps').textContent = bench.fps.toFixed(0);
      el('rSpeed').textContent = state.speedKmh.toFixed(2) + ' km/h';
      el('rBeta').textContent = beta.toFixed(3);
      el('rGamma').textContent = gamma.toFixed(2);
      el('rProper').textContent = state.properTime.toFixed(1) + ' s';
      el('rCoord').textContent = state.coordTime.toFixed(1) + ' s';
      acc = 0; count = 0;
      if (state.auto) {
        if (bench.fps < 52 && state.steps > 60) state.steps -= 12;
        else if (bench.fps > 88 && state.steps < 260) state.steps += 12;
      }
    }
  }
  requestAnimationFrame(frame);
})();
</script>
